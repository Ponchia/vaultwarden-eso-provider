# Requires unreleased main; v0.4.0 supports one global webhook token.
# Example only. Store the real policy with SOPS, External Secrets Operator, or
# another Secret-management workflow. Never commit real bearer tokens.
apiVersion: v1
kind: Secret
metadata:
  name: bweso-auth-policy
  namespace: bweso-system
type: Opaque
stringData:
  auth-policy.json: |
    {
      "version": 1,
      "capabilities": [
        {
          "name": "app-a",
          "tokens": [
            "replace-with-random-token-for-app-a-00000001"
          ],
          "allowedKeys": [
            "id:00000000-0000-0000-0000-000000000001"
          ]
        },
        {
          "name": "app-b",
          "tokens": [
            "replace-with-random-token-for-app-b-00000002"
          ],
          "allowedKeys": [
            "id:00000000-0000-0000-0000-000000000002"
          ]
        }
      ]
    }
