name: Dependency audit

on:
  pull_request:
    paths:
      - Cargo.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Whole-lock advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
      - name: Install pinned whole-lock vulnerability auditor
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Check every locked dependency against current advisories
        run: cargo audit --file Cargo.lock
